# XcodeGen spec. Generate the project with ../scripts/bootstrap-ios.sh
# (or `xcodegen generate` in this folder). The .xcodeproj is not committed.
name: PhotoBooth
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: PhotoBooth/Config/Base.xcconfig
  Release: PhotoBooth/Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PhotoBooth:
    type: application
    platform: iOS
    sources:
      - path: PhotoBooth
        excludes:
          - "Config/**"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOBOOTH_BUNDLE_ID)
        # Also the name Xcode proposes when it creates the App Store Connect record
        # ("PhotoBooth" is taken). The home-screen name is CFBundleDisplayName ("Photo Booth" is also taken: ITMS-90129).
        PRODUCT_NAME: LumixBoothKiosk
        PRODUCT_MODULE_NAME: PhotoBooth
        INFOPLIST_FILE: PhotoBooth/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: ImageCaptureCore.framework
      - sdk: Network.framework
  PhotoBoothTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoBoothTests
    dependencies:
      - target: PhotoBooth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOBOOTH_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LumixBoothKiosk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LumixBoothKiosk
schemes:
  PhotoBooth:
    build:
      targets:
        PhotoBooth: all
        PhotoBoothTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoBoothTests
    archive:
      config: Release
