<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Event gallery</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/event.js" defer></script>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Photo booth</p>
    <h1 id="event-name">&nbsp;</h1>
    <div class="gallery-bar">
      <p class="muted" id="count"></p>
      <div class="segmented" role="group" aria-label="Show">
        <button type="button" data-view="strips" aria-pressed="true">Strips</button>
        <button type="button" data-view="photos" aria-pressed="false">Photos</button>
      </div>
    </div>
    <div class="grid" id="sessions" data-view="strips"></div>
    <p class="center muted hidden" id="empty">No photos yet &mdash; check back soon.</p>
    <div class="actions"><button class="btn hidden" id="more" type="button">Load more</button></div>
  </main>
</body>
</html>
