<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery password</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/password.js" defer></script>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>This gallery is password protected</h1>
      <p class="error hidden" id="error">That password didn't work. Please try again.</p>
      <form method="post" action="/gallery/{{eventId}}/login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <div class="actions"><button class="btn primary" type="submit">View gallery</button></div>
      </form>
      <p class="muted">Looking for your own photos? Use the link or QR code from the photo booth &mdash; it works without a password.</p>
    </div>
  </main>
</body>
</html>
