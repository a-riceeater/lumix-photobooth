# Optional: run the server with Docker Compose.
#   cp server/.env.example server/.env   # then fill in secrets (or: cd server && npm run init-env)
#   docker compose up -d --build
services:
  photobooth:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: server/.env
    environment:
      # Paths inside the container; override the values from .env.
      DATA_DIR: /data
      DESIGNS_DIR: /app/designs
      # PHOTOS_DIR: /photos   # uncomment together with the volume below
    ports:
      - "8080:8080"
    volumes:
      - photobooth-data:/data
      # Designs folder: edit by hand or with Admin ▸ Themes (needs write access;
      # the container runs as uid 1000, so `chown -R 1000 designs` on the host).
      - ./designs:/app/designs
      # Keep photos on a different disk:
      # - /mnt/bigdisk/photobooth-photos:/photos

volumes:
  photobooth-data:
